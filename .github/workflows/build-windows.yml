name: Build GammaRay for Windows (Qt5 & Qt6)

on:
  workflow_dispatch: # تشغيل يدوياً بضغطة زر

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - qt_version: '5.15.2'
            qt_arch: 'win64_msvc2019_64'
            output_name: 'GammaRay-Qt5-Windows-x64'
          - qt_version: '6.5.3'
            qt_arch: 'win64_msvc2019_64'
            output_name: 'GammaRay-Qt6-Windows-x64'

    steps:
    # 1. جلب كود GammaRay
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. إعداد بيئة مجمع ميكروسوفت (MSVC)
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # 3. تثبيت إطار عمل Qt بناءً على المصفوفة (Matrix)
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        host: 'windows'
        arch: ${{ matrix.qt_arch }}

    # 4. بناء البرنامج باستخدام CMake لكل نسخة
    - name: Run CMake and Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:\GammaRay_Output_${{ matrix.output_name }}
        cmake --build . --target install --config Release

    # 5. رفع الملفات الناتجة بشكل منفصل
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: D:\GammaRay_Output_${{ matrix.output_name }}

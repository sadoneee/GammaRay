
name: Build GammaRay 3.2.2 for Windows (Qt5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Download GammaRay 3.2.2
      - name: Checkout GammaRay 3.2.2
        uses: actions/checkout@v4
        with:
          repository: KDAB/GammaRay
          ref: v3.2.2
          path: GammaRay

      # 2. Setup MSVC 2019
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64

      # 3. Install Qt 5.15.2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64

      # 4. Configure CMake
      - name: Configure CMake
        run: |
          cmake -S GammaRay -B GammaRay/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=D:/GammaRay_Output `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # 5. Build GammaRay
      - name: Build GammaRay
        run: |
          cmake --build GammaRay/build --config Release --parallel

      # 6. Install GammaRay
      - name: Install GammaRay
        run: |
          cmake --install GammaRay/build --config Release

      # 7. Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GammaRay-3.2.2-Qt5-Windows-x64
          path: D:/GammaRay_Output
          if-no-files-found: error
